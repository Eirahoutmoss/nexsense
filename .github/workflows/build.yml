name: Derleme

# Her PR'da ve main'e her gönderimde: çekirdek testleri, Android lint ve deneme APK'sı.
# main'e gönderimde APK ayrıca "derleme" etiketli ön sürüme yüklenir (güncelleme denetimi ön sürümleri görmez).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: derleme-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Çekirdek testleri
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon :core:test 2>&1 | tee -a derleme.log

      - name: Uygulamayı derle
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:compileDebugKotlin 2>&1 | tee -a derleme.log

      - name: Android lint (statik analiz)
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:lintDebug 2>&1 | tee -a derleme.log

      - name: Deneme APK'sı
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:assembleDebug 2>&1 | tee -a derleme.log

      - name: APK'yı adlandır
        run: cp app/build/outputs/apk/debug/app-debug.apk NexSense-deneme.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NexSense-deneme
          path: NexSense-deneme.apk

      - name: Test ve lint raporları
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raporlar
          path: |
            core/build/reports/tests/
            core/build/test-results/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.txt
            derleme.log
          if-no-files-found: ignore

      - name: Sonuç özetini PR'a yaz
        if: success() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' > sonuc.md
          import glob, re, collections, xml.etree.ElementTree as ET
          t = f = e = s = 0
          for x in glob.glob('core/build/test-results/test/*.xml'):
              r = ET.parse(x).getroot()
              t += int(r.get('tests', 0)); f += int(r.get('failures', 0)); e += int(r.get('errors', 0)); s += int(r.get('skipped', 0))
          print('### Derleme başarılı')
          print(f'- Çekirdek testleri: **{t}** test, {f} başarısız, {e} hata, {s} atlandı')
          try:
              txt = open('app/build/reports/lint-results-debug.txt', encoding='utf-8').read()
          except OSError:
              txt = ''
          ids = collections.Counter(re.findall(r': (Warning|Error|Information): .*\[([A-Za-z0-9]+)\]', txt))
          errs = sum(v for (k, _), v in ids.items() if k == 'Error')
          warns = sum(v for (k, _), v in ids.items() if k == 'Warning')
          print(f'- Android lint: {errs} hata, {warns} uyarı')
          for (k, i), v in ids.most_common(40):
              print(f'  - {k} `{i}` × {v}')
          kw = sorted(set(l.replace('file:///home/runner/work/nexsense/nexsense/', '') for l in open('derleme.log', encoding='utf-8', errors='replace').read().splitlines() if l.startswith('w: ')))
          print(f'- Kotlin derleyici uyarısı: {len(kw)}')
          if kw:
              print('<details><summary>Kotlin uyarıları</summary>\n\n```')
              print('\n'.join(kw[:60]))
              print('```\n</details>')
          lines = [l for l in txt.splitlines() if ': Warning: ' in l][:60]
          if lines:
              print('<details><summary>Uyarı satırları</summary>\n\n```')
              print('\n'.join(l.replace('/home/runner/work/nexsense/nexsense/', '') for l in lines))
              print('```\n</details>')
          PY
          gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" -F body=@sonuc.md > /dev/null

      - name: Hata özetini PR'a yaz
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Derleme başarısız — özet"
            echo '```'
            grep -E "^e: |error:|Error:|FAILED|What went wrong|> Task .* FAILED|Lint found|^\s+at |Exception" derleme.log | head -n 120 || true
            echo '```'
            python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          out = []
          for x in glob.glob('core/build/test-results/test/*.xml'):
              for tc in ET.parse(x).getroot().iter('testcase'):
                  for fl in list(tc.iter('failure')) + list(tc.iter('error')):
                      msg = (fl.get('message') or '').strip()[:400]
                      out.append(f"- {tc.get('classname','').split('.')[-1]}.{tc.get('name')}: {msg}")
          if out:
              print('#### Başarısız testler')
              print('\n'.join(out[:40]))
          PY
            if [ -f app/build/reports/lint-results-debug.txt ]; then
              echo "#### Lint"
              echo '```'
              grep -B1 -A3 -E ": Error:" app/build/reports/lint-results-debug.txt | head -n 150 || true
              echo '```'
            fi
          } > ozet.md
          gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" -F body=@ozet.md > /dev/null

      - name: Ön sürümü güncelle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete derleme --yes --cleanup-tag || true
          gh release create derleme NexSense-deneme.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Deneme derlemesi" \
            --notes "Otomatik deneme derlemesi (commit ${GITHUB_SHA::7}). Kurmak için APK'yı telefona indirip açın. Paket adı com.eirahoutmoss.nexsense.debug; asıl sürümle yan yana kurulur."
